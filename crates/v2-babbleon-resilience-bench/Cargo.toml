[package]
name = "v2-babbleon-resilience-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Babbleon v2 — adversarial regression bench measuring crack-fraction of LLM/agent adversaries against scrambled puzzles across layer configurations."
publish = false

[lib]
# Crate-import name follows the `babbleon_<thing>_v2` convention every
# other v2 crate uses (core, preprocessor, daemon-protocol, vault, ...).
name = "babbleon_resilience_bench_v2"

[[bin]]
name = "babbleon-bench"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[features]
default = []
# Opt-in BPE token-count measurement (crate::token_metrics), mirroring
# tools/tokenizer-benchmark's tokenizer set (cl100k/o200k always,
# r50k/p50k with --include-smaller-tokenizers). Off by default: this
# crate is a default-workspace member (unlike the standalone-workspace
# tools/tokenizer-benchmark), and tiktoken-rs bundles ~2 MB of BPE
# merge tables per tokenizer -- too heavy to pull into every `cargo
# build`/`cargo test` in the workspace for a measurement most bench
# runs don't need. Same opt-in-feature pattern as crates/babbleon's
# `tpm` / `fido2` hardware-backend features.
token-metrics = ["dep:tiktoken-rs"]

[dependencies]
# Direct dependency on the preprocessor lets the bench drive scramble
# in pure-compute mode with a deterministic synthetic secret.  No
# daemon round-trip required during a bench run, so the harness is
# reproducible from a fixed (secret, epoch) seed.
v2-babbleon-preprocessor = { path = "../v2-babbleon-preprocessor" }
v2-babbleon-core = { path = "../v2-babbleon-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
# CLI binary only.
anyhow = { workspace = true }
clap = { workspace = true }
# Optional: see the `token-metrics` feature above.
tiktoken-rs = { version = "0.5", optional = true }

[dev-dependencies]
# Round-trip property tests for the scoring harness and challenge
# loader.  Same shape as the preprocessor's proptest harness.
proptest = { workspace = true }
tempfile = { workspace = true }
