[package]
name = "v2-babbleon-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Babbleon v2 core: per-host mapping, vault, tripwires.  Rewritten under the v2 security baseline (forbid(unsafe_code), HKDF, SecretBox)."
publish = false

[lib]
name = "babbleon_core_v2"
path = "src/lib.rs"

[dependencies]
# Core is now a re-export facade over two carved-out crates
# (docs/v2/scramble-core-carve.md): the OS-agnostic scramble engine and
# the Linux detection/response tier.  Both are re-exported so every
# `babbleon_core_v2::...` call site keeps resolving; a mobile fork
# depends on v2-babbleon-scramble directly and pulls neither this facade
# nor the Linux tier.
v2-babbleon-scramble = { path = "../v2-babbleon-scramble" }
v2-babbleon-linux = { path = "../v2-babbleon-linux" }
# Secret-free launch artefacts (re-exported for back-compat with
# existing `babbleon_core_v2::ActivatedTable` etc. consumers).
v2-babbleon-launch-artefacts = { path = "../v2-babbleon-launch-artefacts" }
# Crypto stack (all RustCrypto, audit-friendly).
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
hex = { workspace = true }
# Secret hygiene.
zeroize = { workspace = true }
subtle = { workspace = true }
# Errors.
thiserror = { workspace = true }
# Logging.
tracing = { workspace = true }
# Internal cache: lazy wordlist.
once_cell = { workspace = true }
# Event serialization (sinks emit JSONL).
serde = { workspace = true }
serde_json = { workspace = true }
# Audit-chain signing.
ed25519-dalek = { workspace = true }

[dev-dependencies]
# Differential test against v1.
babbleon = { path = "../babbleon" }
tempfile = { workspace = true }
